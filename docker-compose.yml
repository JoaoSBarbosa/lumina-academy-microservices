services:

  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: db_lumina_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  postgres-course:
    image: postgres:16
    environment:
      POSTGRES_DB: db_lumina_course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
