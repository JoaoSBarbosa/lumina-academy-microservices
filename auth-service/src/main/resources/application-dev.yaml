server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/db_lumina_auth
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enable: true
    locations: classpath:db/migration