server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/db_lumina_auth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
